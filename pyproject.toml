[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deforestation-detection"
version = "1.0.0"
description = "AI-Powered Deforestation Detection from Satellite Images"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sujay Dharmavar", email = "sujaydharmavar@gmail.com"}
]
keywords = ["deforestation", "satellite", "deep-learning", "computer-vision", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/sujayd033/satellite-deforestation-detection-"
Documentation = "https://github.com/sujayd033/satellite-deforestation-detection-/blob/main/docs"
Repository = "https://github.com/sujayd033/satellite-deforestation-detection-"
Issues = "https://github.com/sujayd033/satellite-deforestation-detection-/issues"

[project.scripts]
deforestation-detect = "main:main"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
